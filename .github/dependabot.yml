version: 2
updates:
  # Dependencias Ruby del sitio Jekyll (Gemfile)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
  # Acciones de GitHub usadas en los flujos de despliegue
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
